name: agent-run

on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      max_trials:
        description: 'Trials this run may charge to the shared budget'
        default: '5'
      agents:
        description: 'Comma-separated agent roles to run'
        default: 'athena'
      stocks:
        description: 'Comma-separated tickers to analyze (blank = default watchlist)'
        default: ''

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gate check
        run: |
          python3 -m tests.test_engine | tail -2
          python3 -m tests.test_agent  | tail -2

      - name: Stock analysis
        run: |
          TICKERS="${{ inputs.stocks }}"
          if [ -z "$TICKERS" ]; then
            python3 analyze_stocks.py --watchlist default --n-sim 300
          else
            python3 analyze_stocks.py $(echo "$TICKERS" | tr ',' ' ') --n-sim 300
          fi

      - name: Agent run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_TRIALS: ${{ inputs.max_trials || '5' }}
          AGENTS: ${{ inputs.agents || 'athena' }}
        run: python3 -m agent.run --max-trials "$MAX_TRIALS" --agents "$AGENTS"

      - name: Build dashboard
        run: python3 build_dashboard.py

      - name: Commit results
        run: |
          git config user.name  "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          git add research/ data/ dashboard.html
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "research: $(date -u +%Y-%m-%d) stocks + agent run"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $i failed, retrying"; sleep $((i * 5))
          done
          echo "could not push after 3 attempts" >&2; exit 1

      - name: Alert on failure
        if: failure()
        run: |
          curl -fsS -X POST "${{ secrets.ALERT_WEBHOOK }}" \
            -d "text=agent-run FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "alert webhook not configured"
