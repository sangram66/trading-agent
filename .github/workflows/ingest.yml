name: daily-ingest

# Forward-collection. The point of this job is that it never misses a day:
# free real-time data is easy, free history is not, so every day you don't
# record is a day you can never buy back.
on:
  schedule:
    - cron: '30 22 * * 1-5'      # 22:30 UTC, after the US close, weekdays
  workflow_dispatch: {}           # manual trigger for testing

# Least privilege: this job writes data back to the repo and nothing else.
permissions:
  contents: write

# Shared with agent-run.yml on purpose: every job that writes to the repo is
# serialised through one queue, so a data commit can never race the ledger.
concurrency:
  group: repo-writer
  cancel-in-progress: false       # never abort a half-written commit

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Cache the HTTP response cache so re-runs don't re-hit rate-limited
      # endpoints. Keyed by date so each day starts clean.
      - uses: actions/cache@v4
        with:
          path: data/.cache
          key: httpcache-${{ github.run_id }}
          restore-keys: httpcache-

      - name: Collect
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}   # your email; SEC requires it
        run: python3 -m engine.ingest.collect

      - name: Verify manifest before committing
        run: python3 -m engine.ingest.collect --verify-only

      - name: Commit
        run: |
          git config user.name  "ingest-bot"
          git config user.email "ingest-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "no new data" && exit 0
          git commit -m "data: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $i failed, retrying"; sleep $((i * 5))
          done
          echo "could not push after 3 attempts" >&2; exit 1

      # GitHub does not notify you when a scheduled run fails, and a silently
      # dead collector is worse than no collector: you find out months later
      # that the history you were counting on has a hole in it.
      - name: Alert on failure
        if: failure()
        run: |
          curl -fsS -X POST "${{ secrets.ALERT_WEBHOOK }}" \
            -d "text=daily-ingest FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "alert webhook not configured"
